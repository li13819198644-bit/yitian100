name: Deploy daily learning analysis

on:
  workflow_dispatch:
    inputs:
      project_ref:
        description: Supabase project reference
        required: true
        type: string
      enable_ai:
        description: Generate optional memory-card drafts
        required: true
        default: false
        type: boolean
      ai_model:
        description: Model name, required when AI drafts are enabled
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-analysis-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_PROJECT_REF: ${{ inputs.project_ref }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      EXPECTED_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      OPENAI_API_KEY: ${{ inputs.enable_ai && secrets.OPENAI_API_KEY || '' }}
      DAILY_ANALYSIS_MODEL: ${{ inputs.enable_ai && inputs.ai_model || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check deployment configuration
        run: |
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{10,40}$ ]] || { echo 'Invalid project reference'; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD'; exit 1; }
          test "${EXPECTED_SUPABASE_URL%/}" = "https://${SUPABASE_PROJECT_REF}.supabase.co" || { echo 'Project does not match the website VITE_SUPABASE_URL'; exit 1; }
          if [ '${{ inputs.enable_ai }}' = 'true' ]; then
            test -n "$OPENAI_API_KEY" && test -n "$DAILY_ANALYSIS_MODEL" || { echo 'Missing AI key or model'; exit 1; }
          fi
      - name: Link database
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - name: Apply migrations
        run: supabase db push
      - name: Deploy worker and connect database notifications
        run: node scripts/deploy-daily-analysis.mjs
